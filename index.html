<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1eb" />
  <meta name="description" content="A considered edit of everyday pieces, chosen to last." />
  <title>Maison Form - The Considered Collection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="announcement">Complimentary delivery on orders over $150 <span aria-hidden="true">&middot;</span> Thoughtfully selected, always
  </div>
  <header class="site-header">
    <div class="header-container">
      <a class="logo" href="#top" aria-label="Maison Form home">MAISON <span>FORM</span></a>
      <div class="search-wrap">
        <label class="visually-hidden" for="search-input">Search the collection</label>
        <input type="search" id="search-input" placeholder="Search the collection" autocomplete="off" />
      </div>
      <button class="bag-button" id="bag-button" type="button" aria-label="View your shopping bag">
        <span>Bag</span><span class="bag-count" id="cart-count" aria-live="polite">0</span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Filter Sidebar -->
    <aside class="filters">
      <div class="filter-header">
        <h2>Filters</h2>
        <button id="clear-filters">Clear All</button>
      </div>

      <!-- Brand Filter -->
      <div class="filter-group">
        <h3>Brand</h3>
        <label><input type="checkbox" name="brand" value="Nike" /> Nike</label>
        <label><input type="checkbox" name="brand" value="Adidas" /> Adidas</label>
        <label><input type="checkbox" name="brand" value="Puma" /> Puma</label>
        <label><input type="checkbox" name="brand" value="Levi's" /> Levi's</label>
        <label><input type="checkbox" name="brand" value="Zara" /> Zara</label>
      </div>

      <!-- Color Filter -->
      <div class="filter-group">
        <h3>Color</h3>
        <label><input type="checkbox" name="color" value="Black" /> Black</label>
        <label><input type="checkbox" name="color" value="White" /> White</label>
        <label><input type="checkbox" name="color" value="Red" /> Red</label>
        <label><input type="checkbox" name="color" value="Blue" /> Blue</label>
        <label><input type="checkbox" name="color" value="Green" /> Green</label>
      </div>

      <!-- Item Type Filter -->
      <div class="filter-group">
        <h3>Item Type</h3>
        <label><input type="checkbox" name="type" value="Shoes" /> Shoes</label>
        <label><input type="checkbox" name="type" value="T-Shirt" /> T-Shirt</label>
        <label><input type="checkbox" name="type" value="Jacket" /> Jacket</label>
        <label><input type="checkbox" name="type" value="Jeans" /> Jeans</label>
        <label><input type="checkbox" name="type" value="Accessories" /> Accessories</label>
      </div>

      <!-- Price Range Filter -->
      <div class="filter-group">
        <h3>Price Range</h3>
        <label><input type="checkbox" name="price" value="0-50" /> Under $50</label>
        <label><input type="checkbox" name="price" value="50-100" /> $50 - $100</label>
        <label><input type="checkbox" name="price" value="100-200" /> $100 - $200</label>
        <label><input type="checkbox" name="price" value="200-9999" /> $200+</label>
      </div>

      <!-- Rating Filter -->
      <div class="filter-group">
        <h3>Rating</h3>
        <label><input type="checkbox" name="rating" value="4" /> 4&#9733; &amp; above</label>
        <label><input type="checkbox" name="rating" value="3" /> 3&#9733; &amp; above</label>
        <label><input type="checkbox" name="rating" value="2" /> 2&#9733; &amp; above</label>
      </div>

      <!-- Sort -->
      <div class="filter-group">
        <h3>Sort By</h3>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Rating</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
    </aside>

    <!-- Product Grid -->
    <section class="products" aria-labelledby="collection-title">
      <div class="collection-heading">
        <div>
          <p class="eyebrow">THE CONSIDERED COLLECTION <span> / </span> 01</p>
          <h1 id="collection-title">A little more considered.</h1>
          <p class="collection-description">Well-made favorites for wherever the day takes you.</p>
        </div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </div>
      <div id="product-grid" class="product-grid"></div>
      <p id="no-results" class="no-results hidden">No products match your filters.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
